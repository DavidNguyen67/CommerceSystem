$kind: http-request
url: '{{baseUrl}}/api/v1/auth/verify/phone/confirm'
method: POST
auth:
  type: bearer
  credentials:
    token: '{{access_token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phoneNumber": "{{phone_number}}",
      "otp": "{{phone_otp}}"
    }
order: 6000
