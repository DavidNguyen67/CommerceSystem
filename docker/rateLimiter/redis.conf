# 1. Bảo mật
requirepass "pS5p3%pIFby£q[(3kc105;*C3P"
bind 0.0.0.0
protected-mode yes

# 2. Quản lý bộ nhớ (Rất quan trọng cho Rate Limiting)
# Giới hạn RAM tối đa cho Redis (ví dụ: 256mb hoặc 512mb tùy máy chủ)
maxmemory 256mb

# Khi đầy RAM, ưu tiên xoá các key có cài TTL (thời gian sống) gần hết hạn nhất
maxmemory-policy volatile-lru

# 3. Tính bền vững (Persistence)
# Với Rate Limiter thông thường (cửa sổ trượt/sliding window, token bucket ngắn hạn):
# - Dữ liệu thường có TTL ngắn (1 giây - vài phút).
# - Tắt hoặc giảm bớt ghi đĩa để tăng throughput IOPS tối đa.
appendonly no
save ""

# 4. Hiệu năng & Network
tcp-keepalive 300
timeout 0