version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-rate-limiter
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pS5p3%pIFby£q[(3kc105;*C3P", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # (Tuỳ chọn) Giao diện trực quan xem các key & TTL đang nhảy
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local